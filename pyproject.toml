[project]
name = "hass-perific"
version = "0.5.1"
description = "Home Assistant custom integration for the Perific / Enegic energy monitor"
requires-python = ">=3.14.2"

# Not a distributable package — this exists to hold tool configuration and the dev
# dependency groups. The integration ships as custom_components/perific/.

[dependency-groups]
dev = [
    "pytest",
    # Pins homeassistant==2026.9.2, matching the deployment target and the image in
    # docker-compose.yml. The minimum-homeassistant group below is what proves the
    # floor in hacs.json still works.
    "pytest-homeassistant-custom-component==0.13.365",
    "basedpyright==1.40.1",
    "pre-commit>=4.0",
    "ruff==0.16.8",
]
# The oldest Home Assistant the integration claims to support, per hacs.json. The
# plugin pins Home Assistant itself, so its version is what sets the floor.
minimum-homeassistant = [
    "pytest",
    "pytest-homeassistant-custom-component==0.13.330",
]

[tool.uv]
conflicts = [
    [
        { group = "dev" },
        { group = "minimum-homeassistant" },
    ],
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".reference"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # the API returns arbitrary JSON; `Any` at that boundary is the honest type
    "COM812",  # conflicts with the formatter
    "CPY001",  # no per-file copyright headers in this project
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "E501",    # line length is the formatter's job
    "EM101",   # naming every exception message costs a line and reads worse
    "EM102",   # as EM101, for f-strings
    "ISC001",  # conflicts with the formatter
    "TRY003",  # long messages outside exception class — HA integrations do this everywhere
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["custom_components.perific"]

[tool.ruff.lint.per-file-ignores]
# These are config-entry key names, not embedded secrets.
"custom_components/perific/const.py" = ["S105"]
# A test's name is its documentation, and its type-only imports are worth keeping at
# runtime so the file reads as ordinary Python.
"tests/**" = [
    "ARG001",   # a fixture is often requested for its effect, not its value
    "ARG002",
    "D100",
    "D102",
    "D103",
    "D401",
    "PLR0913",  # a parametrised test takes the fixtures it takes
    "PLR0917",
    "PLR2004",  # comparing against a literal is the point of an assertion
    "S101",     # pytest assertions
    "S105",     # fixture tokens are not real credentials
    "S106",
    "SLF001",
    "TC001",
    "TC002",
    "TC003",
]
# The probe is a standalone diagnostic script: it prints to stdout by design, and its
# own helpers are documented by the module docstring rather than one apiece. It opens
# only the https URL it builds against the API host.
"scripts/probe_api.py" = [
    "C901",
    "D102",
    "D103",
    "D107",
    "PLR0911",
    "PLR0913",  # send() takes one parameter per request encoding it can try
    "PLR0915",  # main() is a linear script: one statement per probe step
    "PLR2004",
    "S310",
    "T20",
    "TRY301",
]
# The gap measurement is a diagnostic script on the same terms as the probe above:
# stdout is its output, and the module docstring documents it rather than one
# docstring per helper.
"scripts/measure_gaps.py" = [
    "D102",
    "D103",
    "D107",
    "PLR2004",
    "T20",
    "TRY301",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# custom_components/ is a namespace package; this is what makes it importable.
pythonpath = ["."]

[tool.basedpyright]
pythonVersion = "3.14"
include = ["custom_components/perific", "tests"]
# basedpyright's own default is "recommended", which turns on rules like
# reportAny and reportUnusedCallResult. Those are not a fit for code written
# against Home Assistant's surface, so the baseline is pyright's standard.
typeCheckingMode = "standard"
# Home Assistant declares `available` and `entity_description` as cached
# properties on Entity and expects subclasses to narrow or override them; every
# integration that does so trips these. Suppressed rather than worked around,
# per the convention in AGENTS.md — the code copied from core should pass
# unchanged. Re-enabled for the vendored client below, which has no HA types in
# it and so has no excuse.
reportIncompatibleVariableOverride = "none"
reportIncompatibleMethodOverride = "none"

# The vendored client is standalone and fully typed, so strict costs nothing
# there and catches the field-parsing errors that would otherwise surface as a
# silently None sensor.
# `typeCheckingMode` is not a valid key inside an execution environment — it is
# accepted silently and ignored, which loses the strictness without saying so.
# The rules are therefore named one by one. They are the no-implicit-Any family
# that carried the weight under mypy's `strict`, and a deliberate typing hole in
# this package must fail the build; check that with a throwaway untyped function
# before trusting a change here.
[[tool.basedpyright.executionEnvironments]]
root = "custom_components/perific/api"
reportIncompatibleVariableOverride = "error"
reportIncompatibleMethodOverride = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownParameterType = "error"
# reportUnknownMemberType and reportUnknownVariableType stay off. This package
# parses arbitrary JSON with `.get()` and defaults on purpose — see the
# tolerant-parsing note in AGENTS.md and the ANN401 entry below — so the values
# it reads genuinely are unknown until a model coerces them. Signatures still
# have to be typed, which is what the rules above enforce.
reportUntypedBaseClass = "error"
reportUntypedClassDecorator = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedNamedTuple = "error"
reportPrivateUsage = "error"
reportInvalidTypeVarUse = "error"
reportRedeclaration = "error"
reportMatchNotExhaustive = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnnecessaryIsInstance = "error"

# Home Assistant's result types — ConfigFlowResult, StatisticData — mark most of
# their keys NotRequired, so reading one is an error even where the flow under
# test is contractually required to have set it. In production that rule catches
# a latent KeyError; in a test the KeyError *is* the assertion, and wrapping
# every read would bury what each test is actually checking. Off here, on
# everywhere else.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
# An execution environment resolves imports from its own root, so the repo root
# has to be named here as well. It is the same path pytest's `pythonpath` adds,
# and for the same reason: custom_components/ is a namespace package.
extraPaths = ["."]
reportTypedDictNotRequiredAccess = "none"
