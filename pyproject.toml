[project]
name = "hass-perific"
version = "0.0.0"
description = "Home Assistant custom integration for the Perific / Enegic energy monitor"
requires-python = ">=3.14"

# Not a distributable package — this exists to hold tool configuration and the dev
# dependency group. The integration ships as custom_components/perific/.

[dependency-groups]
dev = [
    # Pins homeassistant==2026.9.2 itself, matching the deployment target and the
    # image in docker-compose.yml. Bump all three together or tests stop being
    # representative.
    "pytest-homeassistant-custom-component==0.13.365",
    "ruff==0.16.7",
    "mypy==2.3.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".reference"]

[tool.ruff.lint]
# Chosen to overlap Home Assistant core's own selection, so patterns copied from
# upstream integrations pass unchanged.
select = [
    "A",      # flake8-builtins
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INP",    # flake8-no-pep420
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "E501",    # line length is the formatter's job
    "TRY003",  # long messages outside exception class — HA integrations do this everywhere
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation, and its type-only imports are worth keeping at
# runtime so the file reads as ordinary Python.
"tests/**" = ["D100", "D102", "D103", "D401", "SLF001", "TC001", "TC002", "TC003"]
# The probe is a standalone diagnostic script: it prints to stdout by design, and its
# own helpers are documented by the module docstring rather than one apiece.
"scripts/probe_api.py" = ["D102", "D103", "D107", "T20", "TRY301"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# custom_components/ is a namespace package; this is what makes it importable.
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true
# Scoped to the vendored client only: it is standalone and fully typed, so strict
# checking is cheap here and catches the field-parsing errors that would otherwise
# surface as a silently None sensor. The HA-facing modules are deliberately excluded.
files = ["custom_components/perific/api"]
