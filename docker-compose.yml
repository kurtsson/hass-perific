# Local Home Assistant for developing this integration.
#
# The image tag must match the deployment target and the homeassistant version that
# pytest-homeassistant-custom-component pins in pyproject.toml. All three move together.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.2
    container_name: perific-dev-ha
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      TZ: Europe/Stockholm
    volumes:
      # One mount, deliberately. Bind-mounting the component directly at
      # /config/custom_components/perific nests a mount inside this one, and on Docker
      # Desktop for Mac the inner mount silently empties while the container runs —
      # HA then reports "Cannot find integration perific" or fails to import
      # config_flow, which reads like broken code rather than a broken mount.
      # scripts/dev-sync.sh copies the component in here instead.
      - ./dev/config:/config
